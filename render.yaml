services:
  - type: web
    name: psych-professor
    runtime: docker
    plan: free                   # free tier — no credit card needed
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false              # paste this in the Render dashboard
      - key: CLAUDE_MODEL
        value: claude-opus-4-7
    # No persistent disk needed — profile state lives in the browser (localStorage)
