<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#080813"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.6"/>
  <!-- Inner eye shape -->
  <ellipse cx="50" cy="50" rx="22" ry="14" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <!-- Iris -->
  <circle cx="50" cy="50" r="9" fill="#7c3aed"/>
  <!-- Pupil -->
  <circle cx="50" cy="50" r="4" fill="#080813"/>
  <!-- Highlight -->
  <circle cx="53" cy="47" r="2" fill="#e0d0ff" opacity="0.7"/>
  <!-- Scan lines (data feel) -->
  <line x1="14" y1="50" x2="28" y2="50" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <line x1="72" y1="50" x2="86" y2="50" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
</svg>
